name: Build ThinkNode M1 PB UI

on:
  push:
    branches:
      - thinknode-m1-pb-ui-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ThinkNode M1 Companion BLE
        run: pio run -e ThinkNode_M1_companion_radio_ble

      - name: Create UF2
        run: pio run -e ThinkNode_M1_companion_radio_ble -t create_uf2

      - name: Collect firmware
        run: |
          mkdir -p dist
          cp .pio/build/ThinkNode_M1_companion_radio_ble/firmware.uf2 dist/ThinkNode_M1_PB_ChatGPT_UI_v1.0.uf2
          cp .pio/build/ThinkNode_M1_companion_radio_ble/firmware.hex dist/ThinkNode_M1_PB_ChatGPT_UI_v1.0.hex
          cp .pio/build/ThinkNode_M1_companion_radio_ble/firmware.bin dist/ThinkNode_M1_PB_ChatGPT_UI_v1.0.bin 2>/dev/null || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThinkNode_M1_PB_ChatGPT_UI_v1.0
          path: dist/
          if-no-files-found: error
